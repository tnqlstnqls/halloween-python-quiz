<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halloween Python Escape</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Black+Han+Sans&family=Black+And+White+Picture&family=Stylish&display=swap">
<style>
:root{color-scheme:dark;--bg:#14091f;--bg2:#241038;--card:#2a1745;--line:#4b2b73;--tx:#f3eafc;--mu:#b9a5d3;--or:#ff8a1f;--pu:#b98cff;--ok:#5be39b;--bad:#ff6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Stylish,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;font-size:18px;color:var(--tx);background:radial-gradient(circle at 80% 8%,#5a2d8f55,transparent 40%),linear-gradient(var(--bg2),var(--bg));line-height:1.6}
#app{max-width:980px;margin:0 auto;padding:16px}
h1,h2,h3{margin:.2em 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:var(--or);color:#2a1100}
.btn.sec{background:#3b2260;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pu);outline-offset:2px}
input[type=text],textarea{width:100%;font:inherit;background:#150a24;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:300px;resize:vertical;tab-size:4;white-space:pre}
pre.code{background:#120820;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:10px 0}
pre.code i{font-style:normal}.k{color:#ff7ac6}.c{color:#7f6d99}.n{color:#ffb86b}.f{color:#7fd1ff}
.hero{text-align:center;padding:10px 0}
.hero h1{font-size:clamp(28px,6vw,46px);color:var(--or);letter-spacing:.5px}
.hero p{color:var(--pu);font-size:18px;margin:0}
.ghost{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:200px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:14px}
.bar{height:10px;background:#150a24;border-radius:9px;overflow:hidden;margin:8px 0}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--or));transition:width .5s}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;border:1px solid var(--line);background:#1d0f31;color:var(--tx);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-current=true]{border-color:var(--or);color:var(--or);font-weight:700}
.chip:disabled{opacity:.45;cursor:not-allowed}
.lv{display:inline-block;background:#3b2260;border-radius:8px;padding:2px 10px;font-size:13px;color:var(--pu)}
.hint{border-left:4px solid var(--pu);background:#1d0f31;padding:8px 12px;margin:8px 0;border-radius:6px}
.msg{padding:10px 14px;border-radius:10px;margin:10px 0;font-weight:600}
.msg.bad{background:#4a1523;color:var(--bad)}.msg.ok{background:#12372b;color:var(--ok)}
.win{border-color:var(--ok);animation:pop .5s}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
.clue{font-size:20px;color:var(--or);font-weight:700}
.clues span{display:inline-block;background:#1d0f31;border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin:3px}
label.opt{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stats div{background:#1d0f31;border-radius:12px;padding:12px;text-align:center}.stats b{display:block;font-size:26px;color:var(--or)}
.conf{position:fixed;top:-30px;font-size:26px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:420px}
small{color:var(--mu)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(#0f3347,#1a1233 55%,#07040d)}
.bg .sc{position:absolute;left:0;bottom:0;width:100%;height:100%}
.web{position:absolute;top:0;right:0;width:min(34vw,260px);opacity:.5}
.fog{position:absolute;left:-20%;width:140%;height:30%;background:radial-gradient(ellipse at center,#c9d6e84d,transparent 65%);animation:drift 22s linear infinite alternate}
.f1{bottom:12%}.f2{bottom:-4%;animation-duration:30s}
@keyframes drift{to{transform:translateX(12%)}}
.pk{position:absolute;bottom:1vh;filter:drop-shadow(0 0 14px #ff8a1f);animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 26px #ffc04d) brightness(1.25)}}
.bat{position:absolute;left:0;font-size:28px;animation:bat 14s linear infinite}
@keyframes bat{from{transform:translateX(-10vw)}50%{transform:translateX(50vw) translateY(-40px)}to{transform:translateX(110vw) translateY(10px)}}
.flick{animation:fk 3s infinite}@keyframes fk{0%,100%{opacity:1}45%{opacity:.5}50%{opacity:1}70%{opacity:.7}}
.hero2{text-align:center;padding:24px 0 8px}
.ttl{margin:0;font-family:Creepster,Impact,fantasy;font-weight:400;color:#ff8a1f;font-size:clamp(50px,11vw,112px);line-height:1;letter-spacing:3px;text-shadow:0 0 22px #ff8a1f99,0 5px 0 #7a2a00,0 10px 24px #000}
.sub{margin:10px 0 0;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:clamp(22px,4.5vw,36px);color:#ffe2b0;text-shadow:0 0 14px #ff8a1f,0 3px 8px #000}
.glass{max-width:720px;margin:16px auto;background:#120a24d9;backdrop-filter:blur(6px);border-color:#ff8a1f66;box-shadow:0 10px 40px #000a}
.glass h2,.glass h3{text-align:center;font-family:"Black And White Picture","Black Han Sans",sans-serif;font-weight:400;font-size:28px;color:#ffb347;letter-spacing:1px}
.glass p,.glass li{font-family:Stylish,"Noto Sans KR",sans-serif;font-size:20px;line-height:1.7}
.glass label{display:block;text-align:center;margin-top:6px;font-family:"Black And White Picture","Black Han Sans",sans-serif;font-weight:400;font-size:28px;color:#ffb347;letter-spacing:1px}
.glass input[type=text]{display:block;width:240px;max-width:100%;margin:6px auto;text-align:center;font-family:Stylish,"Noto Sans KR",sans-serif;font-size:20px}.glass ul{max-width:520px;margin:0 auto 16px}
.big{display:block;width:100%;max-width:420px;margin:18px auto 6px;font:inherit;font-size:24px;font-weight:800;padding:18px 40px;border:0;border-radius:999px;cursor:pointer;color:#10240a;background:linear-gradient(90deg,#a6ff1a,#18e0e8);box-shadow:0 0 30px #5dffb066;transition:transform .15s}
.big:hover{transform:scale(1.04)}.big:focus-visible{outline:3px solid #fff;outline-offset:3px}
.card{background:#1a0d2ed9;backdrop-filter:blur(6px)}
.intro{display:flex;gap:16px;align-items:flex-start}
.thumb{width:150px;flex:none;border-radius:14px;border:1px solid var(--line)}
.tag{display:inline-block;background:#3b2260;border-radius:999px;padding:2px 12px;font-size:14px}
@media(max-width:520px){.intro{flex-direction:column}.thumb{width:100%;max-width:220px}}
.gate{position:fixed;inset:0;z-index:3;overflow:hidden;background:#120a1f}
.stage{position:absolute;inset:0;transform-origin:50% 46%;transition:transform 1.5s cubic-bezier(.6,0,.9,.6) .8s}
.gate.open .stage{transform:scale(3.2)}
.gfade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s 1.7s}
.gate.open .gfade{opacity:1}
.wallp{position:absolute;inset:0 0 22% 0;background:repeating-linear-gradient(90deg,#2b1747 0 38px,#331b55 38px 76px)}
.wallp::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 30%,#000b)}
.floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#2a190f,#0d0705);border-top:6px solid #1a0f08}
.sconce{position:absolute;top:30%;font-size:38px;filter:drop-shadow(0 0 18px #ffb347);animation:glow 2.4s ease-in-out infinite}
.dframe{position:absolute;left:50%;top:46%;--h:min(58vh,470px);width:calc(var(--h)*.6);height:var(--h);transform:translate(-50%,-50%);perspective:1100px;border:12px solid #2e1b10;border-radius:50% 50% 0 0/16% 16% 0 0;box-shadow:0 0 50px #000;background:#000}
.room{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:radial-gradient(ellipse at 50% 75%,#ffb347aa,#3a1a3f 55%,#0c0614);display:flex;align-items:flex-end;justify-content:center}
.room span{font-size:46px;margin-bottom:10px;filter:drop-shadow(0 0 16px #ff8a1f)}
.leaf{position:absolute;inset:0;border-radius:inherit;transform-origin:left center;transition:transform 1.5s cubic-bezier(.5,0,.25,1) .25s;backface-visibility:hidden;background:linear-gradient(90deg,#4a2c1a,#6b4228 40%,#4a2c1a);box-shadow:inset 0 0 30px #000a}
.gate.open .leaf{transform:rotateY(80deg)}
.leaf::after{content:"";position:absolute;left:12%;right:12%;bottom:7%;height:28%;border:3px solid #2e1a0f;border-radius:6px;box-shadow:inset 0 0 14px #000a}
.note{position:absolute;left:50%;top:15%;transform:translateX(-50%) rotate(-2deg);width:78%;padding:16px 8px 12px;background:#f1e0a8;color:#3a2410;text-align:center;border-radius:4px;box-shadow:0 8px 16px #0009;font-family:"Black And White Picture","Black Han Sans",sans-serif;line-height:1.35}
.note i{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-style:normal;font-size:24px}
.note small{display:block;font-size:22px;color:#a3321a}.note b{font-weight:400;font-size:18px}
.knob{position:absolute;right:9%;top:62%;z-index:2;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff2b0,#d49a1f 60%,#7a5410);box-shadow:0 0 0 4px #0003,0 0 18px #ffcc55;animation:kp 1.6s ease-in-out infinite}
.knob:hover{transform:scale(1.15)}.knob:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes kp{50%{box-shadow:0 0 0 7px #ffcc5533,0 0 36px #ffe08a}}
.gtxt{position:absolute;left:0;right:0;bottom:7%;text-align:center;margin:0;padding:0 16px;font-family:Stylish,"Noto Sans KR",sans-serif;font-size:clamp(18px,3.4vw,26px);color:#ffe2b0;text-shadow:0 0 12px #ff8a1f,0 2px 6px #000;animation:pt 2.4s ease-in-out infinite}
@keyframes pt{50%{opacity:.6}}
.desk{background:radial-gradient(ellipse at 50% 35%,#4a3019 0,#2b1a0d 60%,#150c06 100%)}
.desk::before{content:"";position:absolute;inset:0;opacity:.55;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8 .05' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .09 0 0 0 0 .05 0 0 0 0 .02 0 0 0 1.1 -.1'/></filter><rect width='260' height='260' filter='url(%23n)'/></svg>")}
.desk::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 58%,#ffb04a45,transparent 34%),radial-gradient(circle at 88% 58%,#ffb04a45,transparent 34%),radial-gradient(ellipse at 50% 40%,transparent 38%,#000d)}
.dtop{position:absolute;left:0;right:0;bottom:0;height:26%;border-top:5px solid #8a6038;box-shadow:0 -14px 30px #0009;background:repeating-linear-gradient(0deg,#0000 0 6px,#0001 6px 7px),repeating-linear-gradient(90deg,#0000 0 150px,#0006 150px 152px),linear-gradient(#6b4528,#3a2412 35%,#170d06)}
.deco{position:absolute;z-index:1;bottom:14%;height:min(66vh,560px);width:auto;overflow:visible}
.deco.l{left:0}.deco.r{right:0}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:scale(1,1) rotate(-1deg)}25%{transform:scale(.94,1.07) rotate(1.5deg)}50%{transform:scale(1.05,.95) rotate(-2deg)}75%{transform:scale(.97,1.04) rotate(1deg)}}
.desk .web{z-index:1;opacity:.4}.desk .web.l{right:auto;left:0;transform:scaleX(-1)}
@media(max-width:700px){.deco{height:38vh}}
.card.paper{position:relative;color:#3a2410;background:none;border:0;box-shadow:none;backdrop-filter:none;padding:38px 34px;margin:16px 0 22px;transform:rotate(-.3deg);filter:drop-shadow(0 16px 16px #000c)}
.card.paper::before{content:"";position:absolute;inset:0;z-index:-1;clip-path:var(--torn);box-shadow:inset 0 0 50px 8px #7a4a1a99,inset 0 0 12px 2px #2a1306;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='4' seed='9'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .28 0 0 0 0 .08 0 0 0 1.4 -.45'/></filter><rect width='400' height='400' filter='url(%23s)'/></svg>"),radial-gradient(ellipse at 50% 45%,#f0dfb0 0,#e2c78b 60%,#b9863f 92%,#6e4317 100%)}
.paper p,.paper li,.paper label{font-size:20px;line-height:1.7}
.paper h2{color:#8a2a12;font-family:"Black And White Picture","Black Han Sans",sans-serif;font-weight:400;font-size:28px}
.paper code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#e6d5a8;padding:0 5px;border-radius:4px;font-size:.9em}
.paper h3,.paper .clue{color:#8a2a12}.paper small{color:#6d5a3a}
.paper pre.code{background:#eadbb4;border-color:#cdb67f;color:#3a2a14}
.paper .k{color:#a2257a}.paper .c{color:#8a7a5c}.paper .n{color:#b5560b}.paper .f{color:#1d6fa5}
.paper input[type=text],.paper textarea{background:#fff8e1;color:#3a2410;border-color:#cdb67f}
.paper .hint{background:#eadbb4;border-left-color:#a3321a}
.paper .msg.bad{background:#f6d3d3;color:#8a1c2b}.paper .msg.ok{background:#d5ecd8;color:#1c6b3a}
.paper label.opt{border-color:#cdb67f}
.paper .btn.sec{background:#e3cf9f;color:#3a2410;border-color:#bfa56a}
.nplate{position:absolute;left:50%;top:41%;transform:translateX(-50%);width:54%;padding:6px 10px 2px;text-align:center;background:linear-gradient(#2a1a0e,#170d06);border:2px solid #b8893a;border-radius:6px;box-shadow:inset 0 0 12px #000,0 2px 8px #000b}
.nplate label{display:block;font-family:Stylish,"Noto Sans KR",sans-serif;font-size:15px;color:#e0b042}
.nplate input{width:100%;background:transparent;border:0;border-bottom:1px solid #b8893a;color:#ffe2b0;text-align:center;font:inherit;font-size:18px;padding:2px 0;outline:none}
.nplate input::placeholder{color:#8a6a3a}.nplate input:focus{border-bottom-color:#ffdd77;box-shadow:0 8px 12px -10px #ffdd77}
.gerr{display:block;min-height:18px;font-size:14px;color:#ff9a8a}
.nplate.err{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 7px))}75%{transform:translateX(calc(-50% + 7px))}}
.dbg{background:#0c1113}
.dbg .sc{position:absolute;left:0;bottom:0;width:100%;height:100%}
.dbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,transparent 35%,#000c)}
.lockwrap{position:relative;max-width:520px;margin:44px auto 24px}
.shackle{width:60%;height:140px;margin:0 auto -48px;border:28px solid #c3cad2;border-bottom:0;border-radius:150px 150px 0 0;box-shadow:inset 0 7px 9px #fffa,inset 0 -3px 6px #0005,0 8px 12px #000b}
.lockbody{position:relative;padding:30px 30px 26px;border-radius:28px;text-align:center;color:#1f262d;background:linear-gradient(135deg,#f4f6f9 0%,#b7bfc8 35%,#8b95a0 62%,#d9dee4 100%);border:3px solid #6b7480;box-shadow:inset 0 0 0 3px #ffffff80,inset 0 -12px 26px #0004,0 20px 34px #000d}
.lockbody h2{font-family:"Black And White Picture","Black Han Sans",sans-serif;font-weight:400;font-size:30px;color:#262e36;text-shadow:0 1px 0 #fff9}
.lockbody p{font-family:Stylish,"Noto Sans KR",sans-serif;font-size:20px;line-height:1.6;color:#27303a}
.lockbody input[type=text]{display:block;width:72%;margin:10px auto;text-align:center;font-size:24px;letter-spacing:6px;background:#23262a;color:#f1e3b8;border:2px solid #6b7480;box-shadow:inset 0 3px 10px #000b}
.lockbody input::placeholder{color:#8a8576}
.lockbody .big{background:linear-gradient(#f0cf73,#c3922e);color:#2a1a05;box-shadow:0 4px 0 #6b4c12,inset 0 1px 0 #fff8}
.lockbody .btn.sec{background:#d0d6dc;color:#1f262d;border:1px solid #6b7480}
.lockbody .msg.bad{background:#f4d6d6;color:#8a1c2b}
.dbg{background:#14100c}
.dbg .web{z-index:1;opacity:.4}.dbg .web.l{right:auto;left:0;transform:scaleX(-1)}
.dbg .web.bl{top:auto;bottom:0;right:auto;left:0;transform:scale(-1,-1);opacity:.3}
.dbg .web.br{top:auto;bottom:0;transform:scaleY(-1);opacity:.3}
.clock{position:absolute;top:12px;right:28px;font-family:Stylish,"Noto Sans KR",sans-serif;font-size:16px;color:#7a5a30}
.rt{width:100%;border-collapse:collapse;font-size:18px}
.rt th,.rt td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.rt th{background:#3b2260;color:var(--or);font-weight:400}
.tbtn{display:block;width:100%;max-width:420px;margin:14px auto;font-family:"Black And White Picture","Black Han Sans",sans-serif;font-size:24px;line-height:1.6;padding:16px 40px;border-radius:999px;cursor:pointer;color:#ffb347;background:#241238d9;border:2px solid #ff8a1f99;box-shadow:0 0 18px #ff8a1f33}
.tbtn:hover{background:#3b2260}.tbtn:focus-visible{outline:3px solid var(--pu);outline-offset:2px}
.modal{z-index:6}
.scroll{position:relative;width:min(92vw,640px)}
.roll{position:relative;z-index:2;height:38px;border-radius:19px;background:linear-gradient(#a9803a 0,#d9b974 28%,#f1dfab 50%,#c9a35e 78%,#8f6a2a 100%);box-shadow:inset 0 2px 3px #fff6,0 6px 10px #0009;transition:transform .9s cubic-bezier(.4,0,.2,1);will-change:transform}
.roll::after{content:"";position:absolute;right:-3px;top:3px;bottom:3px;width:32px;border-radius:50%;background:radial-gradient(circle,#7a5520 0 3px,#d8bb78 4px 7px,#8f6a2a 8px 10px,#ecd69a 11px 14px,#8f6a2a 15px 16px,#c9a35e 17px)}
.sheet{position:relative;z-index:1;margin:-8px 24px;clip-path:inset(0);transition:clip-path .9s cubic-bezier(.4,0,.2,1)}
.sheetpaper{position:absolute;inset:0;z-index:-1;clip-path:var(--scrollclip);background:repeating-linear-gradient(0deg,#0000 0 3px,#8a5a1f10 3px 4px),radial-gradient(ellipse at 50% 45%,#f0dfb0 0,#e6cd92 62%,#c79a52 100%);box-shadow:inset 0 0 40px 6px #7a4a1a88}
.sheetin{position:relative;padding:34px 34px 26px;max-height:calc(100vh - 150px);overflow:auto;color:#3a2410;opacity:1;transition:opacity .5s .4s}
.modal{transition:background .6s}
.modal.closed{background:#0000}
.modal.closed .sheet{clip-path:inset(50% 0 50% 0)}
.modal.closed .r1{transform:translateY(calc(var(--h)/2 - 8px))}
.modal.closed .r2{transform:translateY(calc(8px - var(--h)/2))}
.modal.closed .sheetin{opacity:0;transition:opacity .2s}
.scroll h2{margin:0 0 10px;text-align:center;font-family:"Black And White Picture","Black Han Sans",sans-serif;font-weight:400;font-size:30px;color:#8a2a12}
.scroll p,.scroll li{font-family:Stylish,"Noto Sans KR",sans-serif;font-size:20px;line-height:1.7;color:#3a2410}
.scroll ul{padding-left:24px;margin:0 0 14px}
.savebtn{background:linear-gradient(90deg,#a6ff1a,#18e0e8);color:#10240a}
.gate .wallp{inset:0}
.gate .floor{display:none}
.stage{transform-origin:50% 42%}
.dframe{top:4vh;--h:120vh;width:min(calc(var(--h)*.6),92vw);height:var(--h);transform:translateX(-50%);perspective:1600px}
.room{align-items:flex-start;padding-top:calc(var(--h)*.5)}
.room span{margin:0}
.note{padding:22px 10px 16px}
.note small{font-size:28px}.note b{font-size:22px}
.nplate{width:72%;padding:10px 12px 6px}
.nplate input{font-size:22px;padding:4px 0}
.nplate input::placeholder{font-size:20px}
.gerr{font-size:16px}
.knob{width:52px;height:52px;right:10%}
.gtxt{bottom:0;padding:34px 16px 3vh;background:linear-gradient(transparent,#000d 55%)}
.leaf::after{display:none}
.pn{position:absolute;border:3px solid #2b180c;background:linear-gradient(135deg,#6a4426,#4a2e1a);box-shadow:inset 0 0 0 6px #6e4728,inset 0 0 0 9px #2b180c,inset 0 0 22px #000b}

const CODE5=`points = [5, 12, -3, 8, 99, 20]
score = 0

def calculate_score():
    for point in points:
        if point == 99:
            break

        if point < 0:
            continue

        if point >= 10:
            score = score + point * 2
        else:
            score = score + point

calculate_score()
print(score)`;

// 스토리·게임 규칙 팝업(두루마리). 앱 전체를 다시 그리지 않고 팝업 요소만 넣고 뺀다.
// 종이는 처음부터 완성된 크기로 배치하고, clip-path와 transform(막대 이동)만 움직여 부드럽게 펴지고 말린다.
function openPop(kind){
 if($("#pop"))return;pop=kind;
 const m=document.createElement("div");m.className="modal";m.id="pop";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
 m.innerHTML=`<div class="scroll"><div class="roll r1"></div><div class="sheet"><div class="sheetpaper"></div><div class="sheetin"><h2>${kind==="story"?"📖 스토리":"📜 게임 규칙"}</h2>${kind==="story"?`<p>${STORY}</p>`:`<ul>${RULES}</ul>`}<button class="btn" id="pclose" style="display:block;margin:14px auto 0">닫기</button></div></div><div class="roll r2"></div></div>`;
 document.body.appendChild(m);
 const sh=m.querySelector(".sheet"),r1=m.querySelector(".r1"),r2=m.querySelector(".r2"),si=m.querySelector(".sheetin"),h=sh.offsetHeight;
 m.style.setProperty("--h",h+"px");
 m.onclick=e=>{if(e.target===m)closePop()};
 m.querySelector("#pclose").onclick=closePop;
 // 펼치기: 가운데에서 맞닿아 있던 두 막대가 위아래로 벌어지고, 종이가 가운데에서부터 드러난다 (모두 같은 시간·같은 곡선)
 if(m.animate){
  const o={duration:900,easing:"cubic-bezier(.4,0,.2,1)",fill:"backwards"};
  sh.animate([{clipPath:"inset(50% 0 50% 0)"},{clipPath:"inset(0 0 0 0)"}],o);
  r1.animate([{transform:`translateY(${h/2-8}px)`},{transform:"translateY(0)"}],o);
  r2.animate([{transform:`translateY(${8-h/2}px)`},{transform:"translateY(0)"}],o);
  si.animate([{opacity:0},{opacity:1}],{duration:500,delay:400,fill:"backwards"});
  m.animate([{background:"rgba(0,0,0,0)"},{background:"rgba(0,0,0,.667)"}],{duration:600,fill:"backwards"});
 }
 m.querySelector("#pclose").focus({preventScroll:true});
}
function closePop(){const m=$("#pop");if(!m||m.dataset.closing)return;m.dataset.closing=1;m.getAnimations({subtree:true}).forEach(x=>x.cancel());m.classList.add("closed");setTimeout(()=>{m.remove();pop=null},900)}
const STORY=`할로윈 밤, 신비한 유령의 집에 들어간 여러분. 그런데 출구가 잠겨 버렸다! 집 곳곳에 숨은 다섯 개의 파이썬 미션을 풀어라. 각 미션의 정답은 탈출 암호의 조각이다. 다섯 조각을 모아 암호를 완성하고 문을 열어라.`;
const RULES=`<li>총 5개의 미션을 해결해야 한다.</li><li>쉬운 단계부터 어려운 단계까지 순서대로 진행한다.</li><li>각 미션의 정답은 탈출 암호의 한 조각이다. 다섯 조각을 순서대로 이어 붙이면 암호가 완성된다.</li><li>미션의 정답이 두 자릿수 이상인 경우 맨 마지막 숫자가 암호 조각이다.</li><li>마지막 미션까지 해결한 뒤, 완성한 암호를 탈출 문에 입력하면 유령의 집에서 탈출할 수 있다.</li><li>미션당 10점, 총 50점 만점이다.</li><li>막히면 힌트를 사용할 수 있다. (미션마다 1개, 사용하면 -2점)</li><li>정답 제출 횟수가 5번 늘어날 때마다 1점씩 감점된다. (5번이면 -1점, 10번이면 -2점)</li>`;
function start(){

let tabFree=false;
function codeKey(e){

 if(e.key!=="Tab"){if(e.key!=="Shift")tabFree=false;return}
 if(e.ctrlKey||e.altKey||e.metaKey)return;

 const put=(a,b,txt)=>{t.setSelectionRange(a,b);if(!document.execCommand("insertText",false,txt)){t.setRangeText(txt,a,b,"end");t.dispatchEvent(new Event("input"))}};
 if(!e.shiftKey&&s===en){put(s,en,IND);return}
 const ls=v.lastIndexOf("\n",s-1)+1,end=en>s&&v[en-1]==="\n"?en-1:en;
 let le=v.indexOf("\n",end);if(le<0)le=v.length;
 const lines=v.slice(ls,le).split("\n"),out=lines.map(l=>e.shiftKey?l.replace(/^( {1,4}|\t)/,""):l?IND+l:l).join("\n");
 const d0=out.split("\n")[0].length-lines[0].length;
 put(ls,le,out);

 const isC=x=>x.length===1&&H_CHO.includes(x),isV=x=>x.length===1&&"ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅛㅜㅠㅡㅣ".includes(x);
 let out="",c="",v="",j="";
 const syl=(c,v,j)=>String.fromCharCode(0xAC00+(H_CHO.indexOf(c)*21+H_JUNG.indexOf(v))*28+(j?H_JONG.indexOf(j.length===2?H_CJ[j]:j):0));
 const flush=()=>{out+=c&&v?syl(c,v,j):(c||v);c=v=j=""};
 for(const x of L){
  if(isV(x)){
   if(!c&&!v||c&&!v)v=x;
   else if(!j){if(H_CV[v+x])v=H_CV[v+x];else{flush();v=x}}
   else if(j.length===2){out+=syl(c,v,j[0]);c=j[1];v=x;j=""}
   else{out+=syl(c,v,"");c=j;v=x;j=""}
  }else if(isC(x)){
   if(!c&&!v)c=x;
   else if(!v||c&&!v){flush();c=x}
   else if(!j){if(H_JONG.includes(x))j=x;else{flush();c=x}}
   else if(H_CJ[j+x])j+=x;
   else{flush();c=x}
  }else{flush();out+=x}
 }
 flush();return out}

// ----- 결과 저장하기: 탈출 성공 화면의 내용(점수·소요 시간·미션별 기록)을 이미지(PNG)로 만들어 저장 -----
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
async function makeResultImage(){
 try{await Promise.all([document.fonts.load('60px Creepster'),document.fonts.load('30px "Black And White Picture"'),document.fonts.load('26px Stylish')])}catch(e){}
 const W=1200,H=980,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
 const FT='Creepster,Impact,fantasy',FH='"Black And White Picture","Black Han Sans",sans-serif',FB='Stylish,"Noto Sans KR","Malgun Gothic",sans-serif';
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#2a1745");bg.addColorStop(1,"#120a1f");g.fillStyle=bg;g.fillRect(0,0,W,H);
 g.strokeStyle="#ff8a1f";g.lineWidth=6;g.strokeRect(24,24,W-48,H-48);
 g.textAlign="center";g.textBaseline="alphabetic";
 g.fillStyle="#ff8a1f";g.font="84px "+FT;g.shadowColor="#ff8a1f88";g.shadowBlur=18;g.fillText("Halloween Python Escape",W/2,130);g.shadowBlur=0;
 g.fillStyle="#ffe2b0";g.font="44px "+FH;g.fillText("유령의 집 탈출 성공!",W/2,200);
 const hint=S.hints.reduce((a,b)=>a+b,0),tt=S.el.reduce((a,b)=>a+b,0);
 const st=[["해결한 미션",nSolved()+"/5"],["최종 점수",total()+"/50"],["사용한 힌트",String(hint)],["소요 시간",fmt(tt)]];
 const bw=240,gap=24,x0=(W-(bw*4+gap*3))/2;
 st.forEach((s,i)=>{const x=x0+i*(bw+gap);g.fillStyle="#3a2260";rr(g,x,240,bw,120,16);g.fill();g.fillStyle="#ff8a1f";g.font="bold 52px "+FB;g.fillText(s[1],x+bw/2,305,bw-20);g.fillStyle="#cdbbe6";g.font="26px "+FB;g.fillText(s[0],x+bw/2,343)});
 g.fillStyle="#ffe2b0";g.font="34px "+FB;g.fillText("탈출 암호: "+M.map(m=>m.ans.slice(-1)).join(" - "),W/2,420);
 const cols=[["미션 번호",180],["이름",300],["푼 시간",200],["제출 횟수",200],["힌트 횟수",200]],rows=[cols.map(c=>c[0])];
 M.forEach((m,i)=>rows.push(["미션 "+(i+1),S.names[i]||"-",fmt(S.el[i]),S.tries[i]+"회",S.hints[i]+"회"]));
 rows.forEach((r,ri)=>{let x=60;const y=460+ri*70;
  r.forEach((txt,ci)=>{const w=cols[ci][1];
   g.fillStyle=ri?"rgba(255,255,255,.04)":"#4b2b73";g.fillRect(x,y,w,70);g.strokeStyle="#6b45a0";g.lineWidth=2;g.strokeRect(x,y,w,70);
   g.fillStyle=ri?"#f3eafc":"#ffb347";g.font=(ri?"28px ":"bold 28px ")+FB;g.fillText(txt,x+w/2,y+45,w-24);x+=w})});
 g.fillStyle="#b9a5d3";g.font="24px "+FB;g.fillText("저장 시각  "+new Date().toLocaleString("ko-KR"),W/2,925);
 return new Promise(res=>c.toBlob(res,"image/png"));
}
async function saveResult(){
 const msg=$("#savemsg"),say=t=>{if(msg)msg.textContent=t};
 say("이미지를 만드는 중...");
 let blob;try{blob=await makeResultImage()}catch(e){blob=null}
 if(!blob){say("이미지를 만들지 못했어요. 화면을 캡처해서 제출해 주세요.");return}
 const d=new Date(),p=n=>String(n).padStart(2,"0"),who=(S.names.find(Boolean)||"결과").replace(/[\\/:*?"<>|]/g,""),
  name="탈출결과_"+who+"_"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes())+".png";
 let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}
 if(dl){
  try{await dl.save({filename:name,data:blob});say("✅ 이미지를 저장했어요. 저장한 이미지를 선생님께 제출하세요.")}
  catch(e){say(e&&e.code==="declined"?"저장을 취소했어요.":"이 화면에서는 저장할 수 없어요. 화면을 캡처해서 제출해 주세요.")}
  return}
 const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
 say("이미지를 저장했어요. 저장되지 않았다면 화면을 캡처해서 제출해 주세요.");
}

function openGate(){
 const g=$("#gate");if(!g||g.classList.contains("open"))return;
 const inp=$("#gname"),v=inp?inp.value.trim():"";
 if(!v){const pl=$("#nplate");pl.classList.remove("err");void pl.offsetWidth;pl.classList.add("err");$("#gerr").textContent="이름을 적어야 문이 열려요.";inp.focus();return}
 S.names[S.cur]=v.slice(0,20);save();
 g.classList.add("open");creak();
 setTimeout(()=>{go(()=>S.opened[S.cur]=1);const f=document.createElement("div");f.style.cssText="position:fixed;inset:0;background:#000;z-index:9;pointer-events:none;transition:opacity .7s";document.body.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.opacity=0));setTimeout(()=>f.remove(),900)},2300)}
// ----- 탈출 문 앞 음악: 빠른 시계 소리, 낮은 맥박, 불안한 현 떨림, 가끔 마녀 웃음 -----
let uzOn=false,unt=0,ubar=0,ucack=0,uz=null,uzf=null,uzs=null,ucd=null;
const UB=.4,URT=[55,55,58.3,55,61.7,58.3,55,82.4],UBASS=[1,1,1.0595,1,1,1.1892,1.0595,1];
const UST=[[440,466.2],[415.3,440],[392,415.3],[440,466.2],[466.2,493.9],[415.3,440],[392,415.3],[493.9,523.3]];
function urgBar(i,t){
 for(let k=0;k<8;k++)tone(URT[i]*2*UBASS[k],t+k*UB/2,.18,"sawtooth",.2,uzf);
 for(let b=0;b<4;b++)tick(t+b*UB,b%2===0,uz);
 thump(t,uz);thump(t+2*UB,uz);
 for(let s=0;s<16;s++)UST[i].forEach(f=>tone(f,t+s*UB/4,.1,"sawtooth",.03,uzs))}
function cackle(){
 const t=AC.currentTime+.05;
 const mk=(s,f0,f1,d,v,vib)=>{const o=AC.createOscillator(),g=AC.createGain(),a=AC.createBiquadFilter(),b=AC.createBiquadFilter();
  o.type="sawtooth";o.frequency.setValueAtTime(f0,t+s);o.frequency.exponentialRampToValueAtTime(f1,t+s+d);
  a.type="bandpass";a.frequency.value=850;a.Q.value=5;b.type="bandpass";b.frequency.value=1900;b.Q.value=7;
  g.gain.setValueAtTime(0,t+s);g.gain.linearRampToValueAtTime(v,t+s+.015);g.gain.exponentialRampToValueAtTime(.001,t+s+d);
  o.connect(a);o.connect(b);a.connect(g);b.connect(g);g.connect(uz);g.connect(ucd);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=7;lg.gain.value=vib;l.connect(lg);lg.connect(o.frequency);l.start(t+s);l.stop(t+s+d+.05)}
  o.start(t+s);o.stop(t+s+d+.05)};
 for(let k=0;k<7;k++)mk(k*.14,420+k*28,380+k*24,.11,.7,0);
 mk(7*.14+.05,640,360,.7,.75,25)}
function startUrgent(){
 uz=AC.createGain();uz.gain.value=0;uz.connect(out);
 uzf=AC.createBiquadFilter();uzf.type="lowpass";uzf.frequency.value=700;uzf.connect(uz);
 uzs=AC.createBiquadFilter();uzs.type="bandpass";uzs.frequency.value=1100;uzs.Q.value=.8;uzs.connect(uz);
 ucd=AC.createDelay(1);ucd.delayTime.value=.3;const f=AC.createGain();f.gain.value=.4;ucd.connect(f);f.connect(ucd);const w=AC.createGain();w.gain.value=.5;ucd.connect(w);w.connect(uz);
 setInterval(()=>{if(!uzOn||AC.state!=="running")return;
  if(unt<AC.currentTime)unt=AC.currentTime+.1;
  while(unt<AC.currentTime+1.8){urgBar(ubar%8,unt);unt+=4*UB;ubar++}
  if(ucack&&AC.currentTime>ucack){cackle();ucack=AC.currentTime+9+Math.random()*10}},100)}
function setScene(){if(!AC)return;const sc=S.screen==="start"||atGate()?0:S.screen==="door"?2:1,t=AC.currentTime,p=sc===1,u=sc===2;if(p&&!pzOn){bar=0;nt=0}if(u&&!uzOn){ubar=0;unt=0;ucack=t+5}pzOn=p;uzOn=u;master.gain.setTargetAtTime(sc===0?1:0,t,.8);pz.gain.setTargetAtTime(p?1:0,t,.8);uz.gain.setTargetAtTime(u?1:0,t,.6)}
const mb=document.createElement("button");
mb.className="btn sec";mb.style.cssText="position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;font-size:22px;padding:8px 14px";
function paintMute(){mb.textContent=muted?"🔇":"🔊";mb.setAttribute("aria-label",muted?"배경음 켜기":"배경음 끄기");mb.setAttribute("aria-pressed",String(muted))}
mb.onclick=()=>{muted=!muted;try{localStorage.setItem("hpe-mute",muted?"1":"0")}catch(e){}initAudio();if(AC){if(AC.state==="suspended")AC.resume();out.gain.setTargetAtTime(muted?0:.5,AC.currentTime,.1)}paintMute()};
paintMute();document.body.appendChild(mb);

const wake=()=>{if(AC&&AC.state==="suspended")AC.resume();if(AC&&AC.state==="running")["pointerdown","keydown","touchstart"].forEach(e=>removeEventListener(e,wake,true))};
